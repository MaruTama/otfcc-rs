[workspace]
members = [
]
[package]
name = "otfcc_rust"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2024"

# Standard cargo layout: the library is src/lib.rs and the two CLI binaries are
# auto-discovered from src/bin/, so neither needs an explicit `path`.
# `staticlib`/`cdylib` mirror what the C build produces (premake5.lua builds
# otfccdll as a SharedLib); the four public `extern "C"` functions in
# src/ffi/dll.rs are what callers reach through the cdylib.
[lib]
name = "otfcc_rust"
crate-type = ["staticlib", "rlib", "cdylib"]

[lints.rust]
# The 0-warning invariant, enforced instead of eyeballed. Safe to make fatal only
# because rust-toolchain.toml pins an exact compiler: a new stable cannot break
# the build by inventing a lint. Bumping that pin is where new warnings get dealt
# with, deliberately.
warnings = "deny"

[lints.clippy]
# CI runs `cargo clippy --all-targets -- -D warnings`, so any lint not listed
# here is a hard build failure -- the same ratchet `unsafe_op_in_unsafe_fn`'s
# per-file `allow` already uses (RUST_MIGRATION.md, "Next steps"), just crate-wide
# instead of per-file, since clippy has no per-file granularity to match. Safe
# to make fatal for the same reason as `[lints.rust]`: the toolchain is pinned,
# so a new clippy version can't invent a warning that breaks this build; a
# version bump is where that gets dealt with.
#
# Every lint below is c2rust-transpile shape, not a judgment call about style,
# and every one is already scoped to a later Phase 5 stage that removes it as
# a side effect of rewriting the lines it fires on -- fixing it here first
# would just be rework once that stage's rewrite lands, and touches files
# those stages already plan to touch, so it's deferred to them instead of
# fixed in this (verification-infrastructure-only) PR. Counts are what
# `cargo clippy --release --all-targets` reported the day this table was
# added; re-run it to see what's left before removing an entry.
#
# Stage 7-4 (C-ism mechanical cleanup) removes these as a direct consequence
# of further mechanical passes over c2rust's transpile shape:
needless_return = "allow" # 1426 -- c2rust's explicit `return expr;` at fn end
# `explicit_auto_deref` removed entirely (was here): the RefCell/RefMut
# reborrow subset, the otf_writer.rs/json_writer.rs/font/caryll_font.rs
# subset (Stage M-35, 103 sites), the 13-site tail (Stage M-36), and finally
# libcff/cff_parser.rs's 359-site CFF charstring interpreter (Stage M-37)
# are all fixed now -- 0 sites crate-wide, re-measured fresh before removing
# this entry -- so the lint needs no allow any more. See RUST_MIGRATION.md.

# Real design work, not a mechanical lint fix -- `too_many_arguments` would
# need restructuring a function's parameter list (e.g. into a struct) and
# `type_complexity` would need introducing named type aliases; both are API
# design choices, not syntax, so left alone deliberately. Counts re-measured
# fresh, not trusted from the prior stale figures.
#
# `type_complexity` removed entirely (was here): all 3 sites (`libcff/
# cff_codecs.rs`'s `DE_T2` decoder table, `table/otl/parse.rs`'s 14-site
# subtable-parser signature, `table/base.rs`'s `parse_base` return type)
# each got a `type` alias -- purely syntactic, no call site needed changing
# for the tuple case (`base.rs`) since destructuring a named tuple type
# looks the same as destructuring the bare tuple -- so the lint needs no
# allow any more. See RUST_MIGRATION.md.
#
# `too_many_arguments`'s original 4 sites: 2 were closed the same
# re-examine-first way (`consolidate.rs`'s `get_point_coordinates`, whose
# `stated`/`x`/`y` out-parameters were always passed as a trio at every
# call site, and `charstring_il.rs`'s `_il_push_maskgroup`, whose
# `contours`/`points` and `nh`/`nv` pairs were always identical between its
# two call sites -- both bundled into a small struct, no behavior change).
# The 2 left below were judged not worth the risk on inspection, not merely
# unexamined: `cff_parser.rs`'s `cff_parse_outline` mixes a per-call-path
# by-value `depth` with a whole-recursion-shared `&mut total_calls`, and
# `subr.rs`'s `serialize_node_to_buffer` passes `&mut [Buffer]` slices that
# are also used standalone (without their own paired count) by
# `resolve_subr_ref` elsewhere in the same file -- bundling either risks
# introducing exactly the kind of behavior-changing bug this migration's
# own rule (verify everything, assume nothing) exists to catch, for a
# lint-only cosmetic win. See RUST_MIGRATION.md.
too_many_arguments = "allow" # 2 -- re-measured (was 4)

[dependencies]
base64 = "0.23.1"
bitflags = "2.13.1"
indexmap = "2.14.0"
libc = "0.2.189"
sha1 = "0.11.0"
# Logging: library code emits `tracing` events and spans; the CLI binaries
# install `logger::OtfccTreeLayer`, which renders them in otfcc's indented
# stderr format. Nothing is printed when no subscriber is installed (the
# cdylib/FFI path and library tests). No proc-macro `attributes` feature.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
criterion = "0.5"
libloading = "0.9.0"
# `default-features = false` + `["read"]`: this crate only ever reads a
# built cdylib's exported-symbol table (tests/abi.rs) -- never writes
# object files and never needs the compression support default features
# pull in for reading compressed debug sections, which the dynamic export
# table itself never is.
object = { version = "0.40.0", default-features = false, features = ["read"] }
regex = "1.13.1"
serde_json = "1.0.151"
sha2 = "0.11.0"

[[bench]]
name = "dump"
harness = false

[[bench]]
name = "build"
harness = false

[[bench]]
name = "subroutinize"
harness = false
