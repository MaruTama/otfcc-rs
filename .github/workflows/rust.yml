name: Rust build & compatibility

# Verifies the checked-in Rust port (rust/) stays green: it builds, its unit
# tests pass, it's clippy-clean, and its output is byte-compatible with the
# frozen "golden" fixtures under tests/golden/. See rust/README.md.
#
# Runs on both Linux (amd64) and macOS (arm64, GitHub's hosted macos-latest
# runners are native Apple Silicon) -- not just Linux. The crate is
# hand-maintained cross-platform code with a real platform-conditional split
# (vendor/sds.rs's ctype externs differ under `#[cfg(target_os = "macos")]`),
# and until this matrix existed the arm64/native-macOS half of "verified on
# both OSes" (rust/README.md's own stated bar for every PR) depended on
# someone running the pipeline by hand locally. As a side effect, the
# otfccdll ctypes check now runs for real here instead of SKIPping: it only
# SKIPs on an architecture mismatch between the built cdylib and the
# runner's python3 (see dll-arch-check.sh), which a native arm64 runner with
# a native arm64 toolchain doesn't have.
#
# This does NOT build or compare against the C toolchain anymore -- c/ (the
# C sources) was confirmed byte-identical to Rust across every payload
# (dump/build output through PR #78, stderr log output afterward) and then
# deleted from the tree entirely; tests/golden/ is that confirmed-good output
# frozen in place, so CI never needs C present, built, or even checked out.
# rust/scripts/archive/compare-with-c.sh still exists for a manual,
# on-demand re-check against C (e.g. before regenerating tests/golden/ after
# a legitimate output-changing fix), but needs c/ restored from git history
# to run -- see rust/scripts/archive/README.md.
#
# This does NOT re-run c2rust (the C -> Rust transpile). The Rust source is
# committed to the repo and hand-maintained; the transpile pipeline is retired
# (rust/scripts/archive/), so a C-side change is ported to Rust by hand. See
# "Regenerating the Rust source" in rust/README.md.
on:
  push:
    branches: [master]
    paths:
      - "tests/**"
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "tests/**"
      - "rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch: {}

jobs:
  # No Docker, no c2rust, no C toolchain on either OS: builds the committed
  # Rust source with the pinned stable toolchain (rust-toolchain.toml; rustup
  # on the runner installs it automatically), runs `cargo test` and
  # `cargo clippy`, and compares its output against tests/golden/
  # byte-for-byte — including the gvar (variable-font) payload (itself a
  # frozen fixture, tests/payload/gvar-test.ttf), stderr log output, and the
  # otfccdll cdylib. Finally runs the project's own round-trip stability
  # tests against the Rust binaries.
  build-test-compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Rust crate and run cargo test
        run: ./rust/scripts/build-crate.sh

      # Pinned exact toolchain (rust-toolchain.toml) means a new stable/clippy
      # release can't invent a warning that breaks this build out from under
      # us -- same reasoning as `warnings = "deny"` in Cargo.toml. The
      # allow-list in `[lints.clippy]` documents, lint by lint, which
      # c2rust-transpile-shaped categories are deferred to a later Phase 5
      # stage rather than fixed here; anything not on that list is a hard
      # failure.
      - name: Clippy
        run: |
          cd rust
          cargo clippy --release --all-targets --locked -- -D warnings

      # Only four symbols are otfcc's real public C ABI (the otfccdll API);
      # everything else the cdylib exports is an artifact of c2rust marking
      # every non-static C function #[no_mangle]. This asserts the four are
      # intact and that the rest of the surface matches the recorded snapshot,
      # so neither an accidental new export nor a silently-dropped one slips
      # through. See the header of check-abi.sh.
      - name: Check the exported C ABI surface
        run: ./rust/scripts/check-abi.sh

      - name: Compare output against the golden fixtures
        run: ./rust/scripts/compare-with-golden.sh

      - name: Compare log output against the golden fixtures
        run: ./rust/scripts/compare-log-output.sh

      - name: Run dump/build cycles (Rust only)
        run: ./rust/scripts/run-cycles.sh

      # Regression test for the GSUB lookup-alias double-push bug (Rust-only
      # fix; see rust/README.md). C crashes on this input, so it was never
      # comparable against C and isn't part of the golden fixtures either.
      - name: Lookup-alias regression test (Rust only)
        run: ./rust/scripts/test-lookup-alias.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compare round-trip stability
        run: node rust/scripts/compare-roundtrips.js

  # Advisory, NOT a merge gate (continue-on-error on every step): this is new
  # dynamic-analysis tooling added specifically because the byte-comparison
  # checks above only ever exercise *valid* payloads, never malformed input --
  # see rust/fuzz/README.md for the concrete bugs it found within seconds of
  # being wired up (a subtract-overflow panic, a null-pointer dereference that
  # only panics instead of being outright UB because of debug-assertions, and
  # a library-internal exit() call that blocks long fuzzing campaigns), none
  # of which are fixed yet. Gating merges on a target whose current findings
  # are known-but-untriaged would just permanently red every unrelated PR;
  # revisit once Stage 7-1/7-3 of the Phase 5 plan address them. Single OS
  # (ubuntu-latest) is enough -- this isn't verifying platform-specific
  # behavior the way build-test-compare's matrix is.
  fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # rust/fuzz/ pins its own nightly (rust/fuzz/rust-toolchain.toml) --
      # rustup picks it up automatically once cwd is inside that directory,
      # same as the main crate's stable pin does for the other job.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed the corpora from tests/payload/
        run: |
          cd rust/fuzz
          mkdir -p corpus/otf_parse corpus/json_build
          cp ../../tests/payload/*.ttf ../../tests/payload/*.otf corpus/otf_parse/
          echo '{}' > corpus/json_build/empty.json
          cp ../../tests/payload/*.json corpus/json_build/ 2>/dev/null || true

      # Short, fixed time budget per target -- not exhaustive fuzzing (that
      # would need a much longer-running, separately-scheduled job). The
      # point of running this in CI at all is to catch a *newly introduced*
      # crash quickly, not to explore the full state space.
      - name: Fuzz otf_parse
        run: |
          cd rust/fuzz
          cargo fuzz run otf_parse -- -max_total_time=60

      - name: Fuzz json_build
        run: |
          cd rust/fuzz
          cargo fuzz run json_build -- -max_total_time=60

      # Both crash inputs below are now *fixed* bugs (see
      # rust/fuzz/README.md's "Known findings" -- the null-glyf and
      # advance-width-overflow entries), so this step now expects both
      # commands to exit 0: a plain regression test pinning "these two
      # specific inputs must not start crashing again," not (as its name
      # used to promise back when they were still open bugs) a check that
      # they still do.
      - name: Regression-test the fixed findings
        run: |
          cd rust/fuzz
          cargo fuzz run json_build ../../tests/fuzz-corpus/known-issues/json-build-cff-charset-null-glyf.bin
          cargo fuzz run json_build ../../tests/fuzz-corpus/known-issues/json-build-advance-width-subtract-overflow.bin

  # Also advisory (continue-on-error): Miri found a real, crate-wide bug the
  # very first time it ran against this crate's own existing test suite (a
  # calloc'd struct's pointer-niche fields -- Vec, Box, Option<Vec<_>>, etc.
  # -- are not a valid bit pattern, so a plain `=` assignment's implicit
  # "drop the old value" is UB the instant that value is constructed, not
  # just if the drop glue would go on to actually free something). One
  # instance is fixed (logger.rs); the rest -- essentially every
  # `otfcc_*_create`/`init_*` pair across the crate -- is not, and is tracked
  # in rust/README.md's "Next steps" rather than chased down in the PR that
  # added this job. `#[cfg_attr(miri, ignore = "...")]` marks both the tests
  # that hit that known, tracked issue and the ones that hit genuine Miri
  # *limitations* (unsupported libc FFI calls, filesystem access under
  # isolation, non-reproducible transcendental-function rounding) -- see each
  # ignored test's own comment for which. `--test-threads=1`: Miri's
  # concurrency emulation is limited and the default multi-threaded test
  # runner produced one flaky failure locally that didn't reproduce
  # single-threaded.
  miri:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Miri
        run: rustup toolchain install nightly-2026-08-17 --component miri

      - name: cargo miri test
        run: |
          cd rust
          cargo +nightly-2026-08-17 miri test --lib -- --test-threads=1
