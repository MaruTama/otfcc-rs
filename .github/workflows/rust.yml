name: Rust build & compatibility

# Verifies the checked-in Rust port (repo root -- the crate was hoisted out
# of rust/ once the C implementation was fully retired; see
# RUST_MIGRATION.md) stays green: it builds, its unit and integration tests
# pass, and it's clippy-clean. See RUST_MIGRATION.md.
#
# Runs on both Linux (amd64) and macOS (arm64, GitHub's hosted macos-latest
# runners are native Apple Silicon) -- not just Linux. The crate is
# hand-maintained cross-platform code with a real platform-conditional split
# (vendor/sds.rs's ctype externs differ under `#[cfg(target_os = "macos")]`),
# and until this matrix existed the arm64/native-macOS half of "verified on
# both OSes" (RUST_MIGRATION.md's own stated bar for every PR) depended on
# someone running the pipeline by hand locally.
#
# Stage F of the migration plan replaced what used to be a chain of
# standalone shell/Python/Node scripts -- byte-comparison against
# tests/golden/, stderr log comparison, dump/build cycle + round-trip
# stability, the GSUB lookup-alias regression, the exported C ABI surface,
# and the otfccdll cdylib FFI boundary -- with `cargo test`-native
# equivalents under tests/*.rs; see each file's own doc comment for
# what it replaced. A plain `cargo test` now covers all of it, including the
# otfccdll check: it loads the cdylib via `libloading` in the SAME process
# it was just built in, so (unlike the old python3/ctypes-based check) there
# is no separate interpreter/architecture that can mismatch, and no
# corresponding arch-mismatch SKIP path is needed here.
#
# This does NOT build or compare against the C toolchain anymore -- c/ (the
# C sources) was confirmed byte-identical to Rust across every payload
# (dump/build output through PR #78, stderr log output afterward) and then
# deleted from the tree entirely; tests/golden/ is that confirmed-good output
# frozen in place, so CI never needs C present, built, or even checked out.
# The manual, on-demand re-check against C this used to describe
# (scripts/archive/compare-with-c.sh) is gone too -- see RUST_MIGRATION.md's
# "Next steps" for when and why; UPDATE_GOLDEN=1 (see tests/golden.rs) is
# how tests/golden/ gets refreshed after a legitimate output-changing fix
# now.
#
# This does NOT re-run c2rust (the C -> Rust transpile) either. The Rust
# source is committed to the repo and hand-maintained; the transpile
# pipeline that originally produced it is retired (see RUST_MIGRATION.md's
# "Next steps"), so a C-side change is ported to Rust by hand.
on:
  push:
    branches: [master]
    paths:
      - "tests/**"
      - "src/**"
      - "fuzz/**"
      - "benches/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "tests/**"
      - "src/**"
      - "fuzz/**"
      - "benches/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  workflow_dispatch: {}

jobs:
  # No Docker, no c2rust, no C toolchain on either OS: builds the committed
  # Rust source with the pinned stable toolchain (rust-toolchain.toml; rustup
  # on the runner installs it automatically), then `cargo test` -- which now
  # covers everything the old per-check steps used to run separately: unit
  # tests, the exported C ABI surface (tests/abi.rs), byte-for-byte
  # comparison against tests/golden/ including the gvar (variable-font)
  # payload (tests/golden.rs), stderr log output (tests/
  # log_output.rs), dump/build cycle + round-trip stability (tests/
  # cycles.rs), the GSUB lookup-alias regression (tests/lookup_alias.rs),
  # and the otfccdll cdylib FFI boundary (tests/dll_abi.rs). See
  # RUST_MIGRATION.md's "Everyday use" section and each file's own doc comment.
  build-test-compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Still needed: tests/golden.rs and lookup_alias.rs shell out to
      # the make-test-*.py fixture generators (kept as external Python
      # tooling by explicit design -- see RUST_MIGRATION.md); those tests skip
      # gracefully, with a stated reason, when python3 isn't found instead of
      # failing the whole run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cargo build
        run: cargo build --release --locked

      # Pinned exact toolchain (rust-toolchain.toml) means a new stable/clippy
      # release can't invent a warning that breaks this build out from under
      # us -- same reasoning as `warnings = "deny"` in Cargo.toml. The
      # allow-list in `[lints.clippy]` documents, lint by lint, which
      # c2rust-transpile-shaped categories are deferred to a later Phase 5
      # stage rather than fixed here; anything not on that list is a hard
      # failure.
      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      # --test-threads=1: tests/golden.rs has two #[test] fns
      # (fixed_payloads_match_golden and
      # synthetic_dedup_and_table_payloads_match_golden) that share a
      # scratch file (build/compare-with-golden-rs/iosevka-r.json) and can
      # race under the default multi-threaded runner -- a known,
      # separately-tracked issue, not fixed here.
      - name: cargo test
        run: cargo test --release --locked -- --test-threads=1

  # Advisory, NOT a merge gate (continue-on-error on every step): this is new
  # dynamic-analysis tooling added specifically because the byte-comparison
  # checks above only ever exercise *valid* payloads, never malformed input --
  # see fuzz/README.md for the concrete bugs it found within seconds of
  # being wired up (a subtract-overflow panic, a null-pointer dereference that
  # only panics instead of being outright UB because of debug-assertions, and
  # a library-internal exit() call that blocks long fuzzing campaigns), none
  # of which are fixed yet. Gating merges on a target whose current findings
  # are known-but-untriaged would just permanently red every unrelated PR;
  # revisit once Stage 7-1/7-3 of the Phase 5 plan address them. Single OS
  # (ubuntu-latest) is enough -- this isn't verifying platform-specific
  # behavior the way build-test-compare's matrix is.
  fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # fuzz/ pins its own nightly (fuzz/rust-toolchain.toml) --
      # rustup picks it up automatically once cwd is inside that directory,
      # same as the main crate's stable pin does for the other job.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed the corpora from tests/payload/
        run: |
          cd fuzz
          mkdir -p corpus/otf_parse corpus/otf_dump corpus/json_build
          cp ../tests/payload/*.ttf ../tests/payload/*.otf corpus/otf_parse/
          cp ../tests/payload/*.ttf ../tests/payload/*.otf corpus/otf_dump/
          echo '{}' > corpus/json_build/empty.json
          cp ../tests/payload/*.json corpus/json_build/ 2>/dev/null || true

      # Short, fixed time budget per target -- not exhaustive fuzzing (that
      # would need a much longer-running, separately-scheduled job). The
      # point of running this in CI at all is to catch a *newly introduced*
      # crash quickly, not to explore the full state space.
      - name: Fuzz otf_parse
        run: |
          cd fuzz
          cargo fuzz run otf_parse -- -max_total_time=60

      # `otf_parse` stops after read_otf; this drives the same input through
      # otfcc_consolidate_font + serialize_to_json too, so bugs that only
      # manifest in consolidate/dump (see fuzz/README.md's
      # required_feature use-after-free) have a fuzz target that can find
      # them.
      - name: Fuzz otf_dump
        run: |
          cd fuzz
          cargo fuzz run otf_dump -- -max_total_time=60

      - name: Fuzz json_build
        run: |
          cd fuzz
          cargo fuzz run json_build -- -max_total_time=60

      # Both crash inputs below are now *fixed* bugs (see
      # fuzz/README.md's "Known findings" -- the null-glyf and
      # advance-width-overflow entries), so this step now expects both
      # commands to exit 0: a plain regression test pinning "these two
      # specific inputs must not start crashing again," not (as its name
      # used to promise back when they were still open bugs) a check that
      # they still do.
      - name: Regression-test the fixed findings
        run: |
          cd fuzz
          cargo fuzz run json_build ../tests/fuzz-corpus/known-issues/json-build-cff-charset-null-glyf.bin
          cargo fuzz run json_build ../tests/fuzz-corpus/known-issues/json-build-advance-width-subtract-overflow.bin
          cargo fuzz run otf_dump ../tests/fuzz-corpus/known-issues/otf-dump-required-feature-use-after-free.bin
          cargo fuzz run otf_parse ../tests/fuzz-corpus/known-issues/otf-parse-glyf-consecutive-zero-length-contours-panic.bin
          cargo fuzz run otf_parse ../tests/fuzz-corpus/known-issues/otf-parse-cff-hintmask-oob-read.bin
          cargo fuzz run otf_dump ../tests/fuzz-corpus/known-issues/otf-dump-ttinstr-npushb-oob-write.bin
          cargo fuzz run otf_parse ../tests/fuzz-corpus/known-issues/otf-parse-otl-contextual-amplification-hang.bin
          cargo fuzz run otf_parse ../tests/fuzz-corpus/known-issues/otf-parse-otl-feature-ref-amplification-oom.bin
          cargo fuzz run otf_dump ../tests/fuzz-corpus/known-issues/otf-dump-glyf-context-missing-maxp-panic.bin
          cargo fuzz run otf_dump ../tests/fuzz-corpus/known-issues/otf-dump-ttinstr-pushw-orphaned-wordhi-oob-read.bin
          cargo fuzz run otf_parse ../tests/fuzz-corpus/known-issues/otf-parse-otl-feature-list-amplification-hang.bin
          cargo fuzz run otf_parse ../tests/fuzz-corpus/known-issues/otf-parse-cff-dict-key-zero-operand-panic.bin
          cargo fuzz run otf_dump ../tests/fuzz-corpus/known-issues/otf-dump-cmap-uvs-non-default-aliasing-oom.bin
          cargo fuzz run otf_parse ../tests/fuzz-corpus/known-issues/otf-parse-otl-coverage-format1-amplification-oom.bin
          cargo fuzz run otf_dump ../tests/fuzz-corpus/known-issues/otf-dump-gpos-pair-zero-stride-class-amplification-oom.bin

  # Also advisory (continue-on-error): Miri found a real, crate-wide bug the
  # very first time it ran against this crate's own existing test suite (a
  # calloc'd struct's pointer-niche fields -- Vec, Box, Option<Vec<_>>, etc.
  # -- are not a valid bit pattern, so a plain `=` assignment's implicit
  # "drop the old value" is UB the instant that value is constructed, not
  # just if the drop glue would go on to actually free something). One
  # instance is fixed (logger.rs); the rest -- essentially every
  # `otfcc_*_create`/`init_*` pair across the crate -- is not, and is tracked
  # in RUST_MIGRATION.md's "Next steps" rather than chased down in the PR that
  # added this job. `#[cfg_attr(miri, ignore = "...")]` marks both the tests
  # that hit that known, tracked issue and the ones that hit genuine Miri
  # *limitations* (unsupported libc FFI calls, filesystem access under
  # isolation, non-reproducible transcendental-function rounding) -- see each
  # ignored test's own comment for which. `--test-threads=1`: Miri's
  # concurrency emulation is limited and the default multi-threaded test
  # runner produced one flaky failure locally that didn't reproduce
  # single-threaded.
  miri:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Miri
        run: rustup toolchain install nightly-2026-08-17 --component miri

      # This job still took 20+ minutes across two separate PRs after the
      # cache below was first added -- root-caused (not just guessed) by
      # reproducing locally: `cargo miri setup` puts the actual Miri sysroot
      # under `~/.cache/miri` (212MB), a location Swatinem/rust-cache does
      # NOT track by default (it caches `~/.cargo/registry`/`~/.cargo/git`/
      # `target/`, which covers `target/miri`'s dependency-build artifacts
      # but not the separate sysroot cache dir). `cache-directories` adds it
      # explicitly. Confirmed locally that once both are warm, rebuilding
      # nothing and running one filtered module (below) takes single-digit
      # seconds, not minutes -- so this, not the module filter, is what
      # actually addresses the wall-time complaint; the filter is kept too
      # since it's a real, if secondary, reduction once the cache is warm.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: miri-nightly-2026-08-17
          cache-directories: ~/.cache/miri

      # Filtered to just the modules that contain `unsafe fn`/`unsafe {}`
      # (`grep -rl "unsafe fn\|unsafe {" src --include=*.rs`, excluding
      # src/bin/ since `--lib` never covered the two binaries anyway) instead
      # of every `--lib` test. Miri's interpretation overhead scales with how
      # much code actually runs under it, and most of this crate's ~420 lib
      # tests exercise table readers/writers/JSON (de)serialization that
      # touch zero unsafe code -- running those under Miri burns wall time
      # without checking anything Miri exists to check. Each filter is a
      # module-path prefix (`libcff::`/`table::otl` intentionally match their
      # submodules too, e.g. `table::otl::parse`), so this is a coverage
      # *narrowing* by test selection, not a scope reduction of which code
      # is allowed to touch unsafe -- if a future stage adds `unsafe` to a
      # module not in this list, `survey-unsafe.sh`'s own count (checked in
      # the build-test-compare job's history, not gated here) is what would
      # catch that this list has gone stale, the same way `alloc.rs`'s own
      # doc comment going stale was caught by Stage M-21's fresh grep rather
      # than any automated check.
      #
      # All filters in ONE invocation, not a loop of 17: libtest ORs
      # multiple positional filter arguments (any test matching ANY of them
      # runs), confirmed locally (`cargo test --lib -- filter1 filter2 ...`
      # runs the union). A 17-invocation loop paid ~17x cargo's own
      # startup/incremental-check overhead for no benefit once the earlier
      # per-test slow-test-ignore fix (see RUST_MIGRATION.md) removed the
      # one test that had made per-filter timing worth separating out to
      # isolate in CI logs; one invocation measured ~40% faster locally.
      - name: cargo miri test (modules with unsafe code only)
        run: |
          cargo +nightly-2026-08-17 miri test --lib -- \
            otf_reader \
            json_reader \
            "libcff::" \
            vf::vq \
            consolidate \
            otf_writer::stat \
            ffi::dll \
            support::parsed_json \
            support::ctype_compat \
            support::fmt \
            support::stopwatch \
            support::ttinstr \
            support::strtol \
            support::buffer \
            table::glyf \
            table::cff \
            table::otl \
            --test-threads=1
